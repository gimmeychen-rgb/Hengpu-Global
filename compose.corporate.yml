# Independent corporate publication stack. Never starts the development stack.
name: hengpu-corporate
services:
  corporate:
    image: hengpu-corporate:${CORPORATE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.corporate
      args:
        CORPORATE_SITE_URL: ${CORPORATE_SITE_URL:-https://hengpuglobal.com}
        CORPORATE_REVISION: ${CORPORATE_REVISION:-uncommitted}
    ports:
      - "127.0.0.1:${CORPORATE_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/en"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
