worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_max_body_size 1k;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        absolute_redirect off;
        autoindex off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # Safe for local/preview review. Remove only after production indexing approval.
        add_header X-Robots-Tag "noindex, nofollow" always;

        location = / {
            return 307 /en;
        }

        location = /en {
            try_files /en.html =404;
            expires -1;
        }

        location = /zh {
            try_files /zh.html =404;
            expires -1;
        }

        # No broad /_next/ proxy: allow only actual static asset file types.
        location ~ ^/_next/static/.+\.(css|js|woff|woff2|ttf|otf|png|jpg|jpeg|gif|webp|avif|ico|svg)$ {
            try_files $uri =404;
            expires 1y;
        }

        # Includes platform, admin, API, source maps, RSC text files and unknown locales.
        location / {
            return 404;
        }
    }
}
